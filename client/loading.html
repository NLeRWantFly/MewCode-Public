<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MewCode 正在启动</title>
  <link rel="stylesheet" href="loading.css">
</head>
<body>
  <div class="title-drag-region" aria-hidden="true"></div>
  <main>
    <div class="brand-row">
      <div class="mark" aria-hidden="true">M</div>
      <div>
        <p class="eyebrow">LOCAL AGENT RUNTIME</p>
        <h1>正在启动 MewCode</h1>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite">正在准备本地安全运行时与 Python 后端…</p>
    <div id="progress" class="boot-progress" aria-label="启动进度"><span></span></div>
    <section id="error-panel" class="diagnostic-panel" hidden>
      <details open>
        <summary>启动诊断</summary>
        <pre id="diagnostics"></pre>
      </details>
      <button id="retry" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        重新启动
      </button>
    </section>
  </main>
  <script src="loading.js"></script>
</body>
</html>
