[project]
name = "mewcode"
version = "0.2.0"
description = "A terminal AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "packaging>=23.2",
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.46.0",
    "langgraph>=1.0,<2.0",
    "python-multipart>=0.0.20",
    "jsonschema>=4.23.0",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "pypdfium2>=5.12,<6",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
mewcode = "mewcode.__main__:main"
mewcode-coord = "mewcode.mcp.coord_server:main"
mewcode-coord-worker = "mewcode.mcp.coord_worker:main"

[project.optional-dependencies]
redis = [
    "redis>=5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["mewcode"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "pyinstaller>=6.0.0",
]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
